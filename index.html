      const useOnScreen = (options) => {
        const ref = useRef(null);
        const [isVisible, setIsVisible] = useState(false);

        useEffect(() => {
          const observer = new IntersectionObserver(([entry]) => {
            if (entry.isIntersecting) {
              setIsVisible(true);
              observer.disconnect(); 
            }
          }, options);
          if (ref.current) observer.observe(ref.current);
          return () => { if (ref.current) observer.unobserve(ref.current); };
        }, [ref, options]);

        return [ref, isVisible];
      };

      const FadeIn = ({ children, delay = 0, className = "", direction = 'up' }) => {
        const [ref, isVisible] = useOnScreen({ threshold: 0.1 });
        
        const transforms = {
          up: 'translate-y-10',
          left: '-translate-x-10',
          right: 'translate-x-10'
        };

        return (
          <div 
            ref={ref} 
            className={`transition-all duration-1000 ease-out transform ${isVisible ? 'opacity-100 translate-y-0 translate-x-0' : `opacity-0 ${transforms[direction]}`} ${className}`}
            style={{ transitionDelay: `${delay}ms` }}
          >
            {children}
          </div>
        );
      };

      // Animated Number Counter
      const AnimatedNumber = ({ end, suffix = "" }) => {
        const [count, setCount] = useState(0);
        const [ref, isVisible] = useOnScreen({ threshold: 0.5 });

        useEffect(() => {
          if (isVisible) {
            let start = 0;
            const duration = 2000;
            const increment = end / (duration / 16);
            const timer = setInterval(() => {
              start += increment;
              if (start >= end) {
                setCount(end);
                clearInterval(timer);
              } else {
                setCount(Math.floor(start));
              }
            }, 16);
            return () => clearInterval(timer);
          }
        }, [isVisible, end]);

        return <span ref={ref} className="tabular-nums">{count}{suffix}</span>;
      };

            desc: "Diseñamos la estructura de deuda óptima. Reorganizamos balances, corregimos ratios y preparamos el expediente perfecto.", 
            time: "Día 4-7",
            icon: <PenTool className="w-6 h-6" />
          },
          { 
            title: "Licitación Competitiva", 
            desc: "No pedimos favor a un banco. Hacemos que 10+ instituciones compitan por tu crédito. Tú eliges las mejores condiciones.", 
            time: "Día 8-15",
            icon: <Building2 className="w-6 h-6" />
          },
          { 
            title: "Cierre & Dispersión", 
            desc: "Gestión legal, firma de contratos y dispersión de recursos. Nuestro trabajo termina cuando el dinero está en tu cuenta.", 
            time: "Día 20+",
            icon: <Wallet className="w-6 h-6" />
          },
        ];

        return (
          <div className="py-24 bg-brand-dark overflow-hidden relative" id="proceso">
             {/* Ambient glow */}
             <div className="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 w-[800px] h-[800px] bg-brand-teal/5 rounded-full blur-[120px] pointer-events-none"></div>

            <div className="max-w-5xl mx-auto px-6 relative z-10">
              <div className="text-center mb-20">
                  <h2 className="text-brand-teal font-bold tracking-widest uppercase text-sm mb-2">Metodología Alifin</h2>
                  <h3 className="text-3xl md:text-5xl font-display font-bold text-white">Ruta Crítica hacia el Capital</h3>
              </div>
              
              <div className="relative">
                {/* Central Vertical Line */}
                <div className="absolute left-8 md:left-1/2 top-0 bottom-0 w-1 bg-gradient-to-b from-brand-teal/0 via-brand-teal/50 to-brand-teal/0 md:-translate-x-1/2"></div>

                <div className="space-y-12">
                  {steps.map((step, idx) => (
                    <div key={idx} className={`relative flex items-center md:justify-between ${idx % 2 === 0 ? 'md:flex-row' : 'md:flex-row-reverse'}`}>
                      
                      {/* Desktop Empty Space for ZigZag */}
                      <div className="hidden md:block w-5/12"></div>

                      {/* Central Node */}
                      <div className="absolute left-8 md:left-1/2 -translate-x-1/2 w-8 h-8 rounded-full bg-brand-dark border-4 border-brand-teal z-20 shadow-[0_0_20px_rgba(45,212,191,0.5)] flex items-center justify-center">
                          <div className="w-2 h-2 bg-white rounded-full"></div>
                      </div>

                      {/* Card Content */}
                      <FadeIn direction={idx % 2 === 0 ? 'right' : 'left'} className="w-full md:w-5/12 pl-20 md:pl-0">
                         <div className="group relative bg-brand-card/30 backdrop-blur-md border border-white/5 rounded-2xl p-8 hover:bg-brand-card/50 hover:border-brand-teal/50 transition-all duration-500 hover:-translate-y-2 hover:shadow-[0_10px_40px_rgba(0,0,0,0.5)]">
                            {/* Large Watermark Number */}
                            <span className="absolute -top-6 -right-4 text-9xl font-bold text-white/5 group-hover:text-brand-teal/10 transition-colors pointer-events-none select-none">
                              0{idx + 1}
                            </span>
                            
                            <div className="relative z-10">
                              <div className="w-12 h-12 rounded-lg bg-brand-teal/10 flex items-center justify-center text-brand-teal mb-4 group-hover:scale-110 transition-transform duration-300">
                                 {step.icon}
                              </div>
                              <h4 className="text-2xl font-bold text-white mb-3 group-hover:text-brand-teal transition-colors">{step.title}</h4>
                              <p className="text-gray-400 text-sm leading-relaxed mb-4">{step.desc}</p>
                              <div className="inline-flex items-center gap-2 px-3 py-1 rounded-full bg-brand-teal/10 border border-brand-teal/20 text-brand-teal text-xs font-bold font-mono">
                                 <Clock className="w-3 h-3" />
                                 {step.time}
                              </div>
                            </div>
                         </div>
                      </FadeIn>
                    </div>
                  ))}
                </div>
              </div>
            </div>
          </div>
        );
      };

      const ContactDashboard = () => {
        const [formData, setFormData] = useState({
          name: '',
          company: '',
          email: '',
          phone: '',
          revenue: '',
          need: 'Capital de Trabajo',
          message: ''
        });

        const handleChange = (e) => {
          setFormData({ ...formData, [e.target.name]: e.target.value });
        };

        const setRevenue = (value) => {
          setFormData({ ...formData, revenue: value });
        };

        const handleSubmit = (e) => {
          e.preventDefault();
          const { name, company, email, phone, revenue, need, message } = formData;
          
          const subject = `Solicitud de Diagnóstico - ${company}`;
          const body = `Hola equipo Alifin.Tech,

      Me interesa iniciar un proceso de arquitectura financiera. Aquí están los datos de mi empresa:

      ------------------------------------------------
      DATOS DE CONTACTO
      ------------------------------------------------
      Nombre: ${name}
      Empresa: ${company}
      Correo: ${email}
      Teléfono: ${phone}

      ------------------------------------------------
      PERFIL FINANCIERO
      ------------------------------------------------
      Facturación Anual Estimada: ${revenue}
      Necesidad Principal: ${need}

      ------------------------------------------------
      MENSAJE ADICIONAL
      ------------------------------------------------
      ${message}

      Quedo atento a su respuesta para agendar la sesión de diagnóstico.
      `;

          window.location.href = `mailto:alifin.tech@grupoalifin.com?subject=${encodeURIComponent(subject)}&body=${encodeURIComponent(body)}`;
        };

        return (
          <div className="py-24 bg-brand-navy/20" id="contacto">
            <div className="max-w-6xl mx-auto px-6">
              <div className="bg-brand-card border border-white/10 rounded-3xl overflow-hidden shadow-2xl flex flex-col md:flex-row">
                 {/* Left: Content */}
                 <div className="p-10 md:w-2/5 bg-gradient-to-br from-brand-teal to-brand-tealDark text-white flex flex-col justify-between relative overflow-hidden">
                    <div className="absolute top-0 left-0 w-full h-full bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20 mix-blend-multiply"></div>
                    <div className="relative z-10">
                      <h3 className="text-3xl font-display font-bold mb-4">¿Calificas?</h3>
                      <p className="text-white/90 mb-8">
                         Nuestro algoritmo de precalificación requiere información básica. Te diremos si podemos ayudarte en menos de 24 horas.
                      </p>
                      <div className="space-y-4 text-sm font-medium">
                         <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><Check className="w-4 h-4" /></div>
                            Confidencialidad Garantizada
                         </div>
                         <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><Clock className="w-4 h-4" /></div>
                            Respuesta Rápida 24h
                         </div>
                         <div className="flex items-center gap-3">
                            <div className="w-8 h-8 rounded-full bg-white/20 flex items-center justify-center"><Shield className="w-4 h-4" /></div>
                            Protección de Datos
                         </div>
                      </div>
                    </div>
                    <div className="relative z-10 mt-12">
                       <p className="text-xs opacity-70">alifin.tech@grupoalifin.com</p>
                    </div>
                 </div>

                 {/* Right: Form */}
                 <div className="p-8 md:p-10 md:w-3/5 bg-brand-dark">
                    <form className="space-y-5" onSubmit={handleSubmit}>
                       <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                          <div className="space-y-2">
                             <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Nombre Completo</label>
                             <input 
                               name="name"
                               value={formData.name}
                               onChange={handleChange}
                               required
                               type="text" 
                               className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-brand-teal focus:outline-none focus:ring-1 focus:ring-brand-teal transition-all placeholder:text-gray-700" 
                               placeholder="Ej. Juan Pérez"
                             />
                          </div>
                          <div className="space-y-2">
                             <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Empresa</label>
                             <input 
                               name="company"
                               value={formData.company}
                               onChange={handleChange}
                               required
                               type="text" 
                               className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-brand-teal focus:outline-none focus:ring-1 focus:ring-brand-teal transition-all placeholder:text-gray-700" 
                               placeholder="Ej. Industrias SA de CV"
                             />
                          </div>
                       </div>

                       <div className="grid grid-cols-1 md:grid-cols-2 gap-5">
                          <div className="space-y-2">
                             <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Correo Corporativo</label>
                             <input 
                               name="email"
                               value={formData.email}
                               onChange={handleChange}
                               required
                               type="email" 
                               className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-brand-teal focus:outline-none focus:ring-1 focus:ring-brand-teal transition-all placeholder:text-gray-700" 
                               placeholder="juan@empresa.com"
                             />
                          </div>
                          <div className="space-y-2">
                             <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Teléfono / WhatsApp</label>
                             <input 
                               name="phone"
                               value={formData.phone}
                               onChange={handleChange}
                               required
                               type="tel" 
                               className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-brand-teal focus:outline-none focus:ring-1 focus:ring-brand-teal transition-all placeholder:text-gray-700" 
                               placeholder="55 1234 5678"
                             />
                          </div>
                       </div>

                       <div className="space-y-2">
                          <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Facturación Anual (MXN)</label>
                          <div className="grid grid-cols-3 gap-3">
                             {['$10M - $50M', '$50M - $200M', '+$200M'].map((opt) => (
                                <button 
                                  key={opt} 
                                  type="button"
                                  onClick={() => setRevenue(opt)}
                                  className={`border rounded-lg p-3 text-xs font-medium transition-all ${
                                      formData.revenue === opt 
                                      ? 'bg-brand-teal text-brand-dark border-brand-teal' 
                                      : 'bg-white/5 text-gray-400 border-white/10 hover:bg-white/10 hover:text-white'
                                  }`}
                                >
                                   {opt}
                                </button>
                             ))}
                          </div>
                          <input type="hidden" name="revenue" required value={formData.revenue} />
                          {!formData.revenue && <p className="text-[10px] text-red-400 opacity-0 group-invalid:opacity-100">* Selecciona un rango</p>}
                       </div>

                       <div className="space-y-2">
                          <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Necesidad Principal</label>
                          <div className="relative">
                              <select 
                                  name="need"
                                  value={formData.need}
                                  onChange={handleChange}
                                  className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-brand-teal focus:outline-none focus:ring-1 focus:ring-brand-teal transition-all appearance-none"
                              >
                                  <option value="Capital de Trabajo">Capital de Trabajo (Liquidez)</option>
                                  <option value="Refinanciamiento de Deuda">Refinanciamiento de Pasivos</option>
                                  <option value="Adquisición de Activos">Adquisición de Activos / Maquinaria</option>
                                  <option value="Expansión">Proyecto de Expansión</option>
                                  <option value="Otro">Otro</option>
                              </select>
                              <ChevronDown className="absolute right-3 top-3.5 w-4 h-4 text-gray-500 pointer-events-none" />
                          </div>
                       </div>

                       <div className="space-y-2">
                          <label className="text-xs text-gray-500 uppercase font-bold tracking-wider">Mensaje Opcional</label>
                          <textarea 
                              name="message"
                              value={formData.message}
                              onChange={handleChange}
                              rows={2}
                              className="w-full bg-white/5 border border-white/10 rounded-lg p-3 text-white focus:border-brand-teal focus:outline-none focus:ring-1 focus:ring-brand-teal transition-all placeholder:text-gray-700 resize-none"
                              placeholder="¿Algo más que debamos saber?"
                          ></textarea>
                       </div>

                       <button 
                          type="submit" 
                          disabled={!formData.revenue || !formData.name || !formData.email}
                          className="w-full bg-white text-brand-dark font-bold py-4 rounded-lg hover:bg-brand-teal hover:text-white hover:scale-[1.02] active:scale-[0.98] transition-all shadow-lg shadow-white/5 hover:shadow-brand-teal/20 disabled:opacity-50 disabled:cursor-not-allowed mt-2"
                       >
                          Enviar Solicitud
                       </button>
                       <p className="text-[10px] text-center text-gray-600 mt-2">
                          Al hacer clic en enviar, se abrirá tu cliente de correo predeterminado con la información lista.
                       </p>
                    </form>
                 </div>
              </div>
            </div>
          </div>
        );
      };

      const Footer = () => {
        return (
          <footer className="bg-brand-dark border-t border-white/5 py-12 text-sm text-gray-500">
            <div className="max-w-7xl mx-auto px-6 flex flex-col md:flex-row justify-between items-center gap-4">
              <p>© {new Date().getFullYear()} Grupo Alifin. Todos los derechos reservados.</p>
              <div className="flex gap-6">
                <a href="#" className="hover:text-white transition-colors">Privacidad</a>
                <a href="#" className="hover:text-white transition-colors">Términos</a>
              </div>
            </div>
          </footer>
        );
      };

      const App = () => {
        return (
          <div className="font-sans antialiased selection:bg-brand-teal selection:text-brand-dark bg-brand-dark overflow-x-hidden text-white">
            <Navbar />
            <Hero />
            <TheProblemVsSolution />
            <BentoServices />
            <ProcessTimeline />
            <ContactDashboard />
            <Footer />
          </div>
        );
      };

      // --- Rendering Logic ---
      const rootElement = document.getElementById('root');
      if (!rootElement) {
        throw new Error("Could not find root element to mount to");
      }

      const root = ReactDOM.createRoot(rootElement);
      root.render(
        <React.StrictMode>
          <App />
        </React.StrictMode>
      );
    </script>
  </body>
</html>
